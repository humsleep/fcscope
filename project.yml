# XcodeGen 프로젝트 정의 — `xcodegen generate` 로 FCScope.xcodeproj 생성 (xcodeproj 는 커밋하지 않음)
name: FCScope
options:
  bundleIdPrefix: xyz.fcscope
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.1
  Nuke:
    url: https://github.com/kean/Nuke
    from: 13.2.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.9.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: "68BP5NY48R"
    CODE_SIGN_STYLE: Automatic
targets:
  FCScope:
    type: application
    platform: iOS
    sources:
      - path: FCScope
        excludes:
          - "Info.plist"
          - "FCScope.entitlements"
          - "FCScope.release.entitlements"
    settings:
      base:
        # 푸시 환경(aps-environment)이 Debug/Release 에서 달라야 해 엔타이틀먼트를 나눈다.
        # Debug=development(Xcode 직접 설치), Release=production(TestFlight·App Store).
        CODE_SIGN_ENTITLEMENTS: FCScope/FCScope.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: xyz.fcscope.app
        PRODUCT_NAME: FC Scope
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FCScope/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_LDFLAGS: "-ObjC"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: FCScope/FCScope.release.entitlements
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - target: FCScopeWidgets
        embed: true
  FCScopeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FCScopeWidgets
      - path: FCScope/Core/Config.swift
      - path: FCScope/Core/API/Models.swift
      - path: FCScope/Core/API/NexonCDN.swift
      - path: FCScope/Core/UI/Theme.swift
      - path: FCScope/Resources/Fonts
    info:
      path: FCScopeWidgets/Info.plist
      properties:
        CFBundleDisplayName: FC Scope
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [ChakraPetch-Medium.ttf, ChakraPetch-SemiBold.ttf, ChakraPetch-Bold.ttf]
    entitlements:
      path: FCScopeWidgets/FCScopeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.xyz.fcscope.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.fcscope.app.widgets
        PRODUCT_NAME: FCScopeWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
